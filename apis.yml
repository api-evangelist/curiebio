aid: curiebio
name: Curie.Bio
description: >-
  Curie.Bio is a seed-stage biotech venture firm and drug-discovery co-pilot co-founded by Zach
  Weinberg (founder of Flatiron Health), Alexis Borisy, and Christoph Lengauer. It pairs seed
  investment — typically $5M-$7M initial checks, backed by a $380M pro-rata Series A follow-on
  fund — with hands-on scientific and operational support from a team of experienced drug hunters,
  helping therapeutics founders design their science and move programs into the clinic and toward
  a strong next round of financing. Curie.Bio has raised close to $1B and is backed by GV, a16z,
  and ARCH Venture Partners. It operates as a company/investor profile in the API Evangelist
  network; it publishes no public developer API or platform, so most technical API artifacts are
  not applicable to this provider.
